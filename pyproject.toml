[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realestaterag"
version = "1.0.0"
description = "GraphRAG-powered Real Estate Intelligence Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "daisybum", email = "sanghyun@example.com" }
]
keywords = ["graphrag", "real-estate", "llm", "knowledge-graph", "falkordb", "proptech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # LLM & AI
    "openai>=1.0.0",
    
    # Database
    "falkordb>=1.0.0",
    "redis>=5.0.0",
    
    # Web Framework
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    
    # Monitoring
    "loguru>=0.7.0",
    "prometheus-fastapi-instrumentator>=6.0.0",
    
    # Utilities
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "aiofiles>=23.0.0",
    
    # Image Processing
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",
    "fakeredis>=2.0.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.23.0",
]

all = [
    "realestaterag[dev,test,docs]",
]

[project.scripts]
realestaterag = "realestaterag.cli:main"

[project.urls]
Homepage = "https://github.com/daisybum/realEstateRAG"
Documentation = "https://github.com/daisybum/realEstateRAG#readme"
Repository = "https://github.com/daisybum/realEstateRAG.git"
Issues = "https://github.com/daisybum/realEstateRAG/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/realestaterag"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

# ============================================================
# Ruff (Linting & Formatting)
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["realestaterag"]

# ============================================================
# Mypy (Type Checking)
# ============================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/realestaterag --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["src/realestaterag"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
