system:
  data_dir: "/workspace/data"
  output_dir: "/workspace/app/realEstateAnalyzer/analysis_results"
  api_url: "http://localhost:8000/v1"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  api_key: "EMPTY"

prompts:
  templates_dir: "prompts/templates"
  environment: "prod"
  ontology_version: "1.0"

# LangSmith 클라우드 연동 설정
# 환경변수 우선: LANGSMITH_API_KEY, LANGSMITH_PROJECT
langsmith:
  enabled: true
  project: "realEstateAnalyzer"
  tracing: true
  
  # Prompt Hub 설정
  hub:
    owner: "df335145-b283-4738-bd7c-1c1fc02aca11"
    prompts:
      - name: "re-base-system"
        local_name: "base_system"
        description: "Ontology-based real estate analyst system prompt"
        tags: ["prod", "v2.0"]
      - name: "re-fact-extraction"
        local_name: "fact_extraction"
        description: "Entity extraction with JSON schema"
        tags: ["prod", "v2.0"]
      - name: "re-visual-verification"
        local_name: "visual_verification"
        description: "Multimodal chart and map analysis"
        tags: ["prod", "v2.0"]
      - name: "re-sentiment-analysis"
        local_name: "sentiment_analysis"
        description: "Market sentiment and field visit analysis"
        tags: ["prod", "v2.0"]
      - name: "re-insight-generation"
        local_name: "insight_generation"
        description: "Final investment insight report"
        tags: ["prod", "v2.0"]
      - name: "re-db-construction"
        local_name: "db_construction"
        description: "Optimized prompt for fast DB construction"
        tags: ["prod", "v2.0", "optimized"]

# FalkorDB 그래프 데이터베이스 설정
falkordb:
  url: "redis://localhost:6379"
  graph_name: "real_estate"
  auto_init_schema: true

# GB10 최적화 설정
gb10_optimization:
  falkordb_memory: "16G"
  llm_memory_reserve: "60G"
