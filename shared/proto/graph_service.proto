syntax = "proto3";

package realestaterag.graph;

option go_package = "github.com/daisybum/realestaterag/graph";

service GraphService {
  // Node operations
  rpc CreateNode(CreateNodeRequest) returns (NodeResponse);
  rpc GetNode(GetNodeRequest) returns (NodeResponse);
  rpc UpdateNode(UpdateNodeRequest) returns (NodeResponse);
  rpc DeleteNode(DeleteNodeRequest) returns (DeleteResponse);
  
  // Relationship operations
  rpc CreateRelationship(CreateRelationshipRequest) returns (RelationshipResponse);
  rpc DeleteRelationship(DeleteRelationshipRequest) returns (DeleteResponse);
  
  // Query operations
  rpc ExecuteCypher(CypherQueryRequest) returns (CypherQueryResponse);
  
  // Ingestion
  rpc IngestReport(IngestReportRequest) returns (IngestReportResponse);
}

// Node messages
message CreateNodeRequest {
  string label = 1;
  map<string, string> properties = 2;
}

message GetNodeRequest {
  string id = 1;
}

message UpdateNodeRequest {
  string id = 1;
  map<string, string> properties = 2;
}

message DeleteNodeRequest {
  string id = 1;
}

message NodeResponse {
  string id = 1;
  string label = 2;
  map<string, string> properties = 3;
}

// Relationship messages
message CreateRelationshipRequest {
  string source_id = 1;
  string target_id = 2;
  string type = 3;
  map<string, string> properties = 4;
}

message DeleteRelationshipRequest {
  string id = 1;
}

message RelationshipResponse {
  string id = 1;
  string type = 2;
  string source_id = 3;
  string target_id = 4;
  map<string, string> properties = 5;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

// Cypher query messages
message CypherQueryRequest {
  string query = 1;
  map<string, string> parameters = 2;
}

message CypherQueryResponse {
  repeated NodeResponse nodes = 1;
  repeated RelationshipResponse relationships = 2;
  string raw_json = 3;
  int32 result_count = 4;
}

// Ingestion messages
message IngestReportRequest {
  string report_id = 1;
  repeated string facts = 2;
  repeated string insights = 3;
  map<string, string> metadata = 4;
}

message IngestReportResponse {
  string report_id = 1;
  int32 nodes_created = 2;
  int32 relationships_created = 3;
  bool success = 4;
  string message = 5;
}
