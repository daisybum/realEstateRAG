apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: realestaterag-prod

replicas:
  - name: realestaterag-api
    count: 3

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1000m"
    target:
      kind: Deployment
      name: realestaterag-api

configMapGenerator:
  - name: realestaterag-config
    behavior: merge
    literals:
      - environment=production
      - log_level=WARNING
