version: '3.8'

services:
  # FalkorDB Graph Database
  falkordb:
    image: falkordb/falkordb:latest
    container_name: realestaterag-db
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    environment:
      - REDIS_ARGS=--save 60 1000
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - realestaterag-network
    restart: unless-stopped

  # API Service
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    container_name: realestaterag-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=wolbu_v3
      - LLM_API_URL=http://vllm:8000/v1
      - LOG_LEVEL=INFO
    env_file:
      - ../../.env
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ../../data:/workspace/data:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestaterag-network
    restart: unless-stopped

  # Streamlit UI (optional)
  streamlit:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.streamlit
    container_name: realestaterag-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - realestaterag-network
    profiles:
      - ui
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: realestaterag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - realestaterag-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: realestaterag-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - realestaterag-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  falkordb-data:
  prometheus-data:
  grafana-data:


networks:
  realestaterag-network:
    driver: bridge
