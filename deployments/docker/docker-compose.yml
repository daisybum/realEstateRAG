version: '3.8'

services:
  # FalkorDB Graph Database (Legacy - for migration)
  falkordb:
    image: falkordb/falkordb:latest
    container_name: realestaterag-db
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    environment:
      - REDIS_ARGS=--save 60 1000
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - realestaterag-network
    restart: unless-stopped
    profiles:
      - legacy

  # Neo4j Graph Database (Primary)
  neo4j:
    image: neo4j:5.25-community
    container_name: realestaterag-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/changeme}
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - realestaterag-network
    restart: unless-stopped

  # API Service
  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    container_name: realestaterag-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_GRAPH_NAME=wolbu_v3
      - LLM_API_URL=http://vllm:8000/v1
      - LOG_LEVEL=INFO
    env_file:
      - ../../.env
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ../../data:/workspace/data:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - realestaterag-network
    restart: unless-stopped

  # Streamlit UI (optional)
  streamlit:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.streamlit
    container_name: realestaterag-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - realestaterag-network
    profiles:
      - ui
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: realestaterag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - realestaterag-network
    profiles:
      - monitoring
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: realestaterag-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - realestaterag-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  falkordb-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  neo4j-plugins:
  prometheus-data:
  grafana-data:


networks:
  realestaterag-network:
    driver: bridge
